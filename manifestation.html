<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
  function ajusterQuadrillage() {
    document.querySelectorAll('.accueil').forEach(function (zone) {
      var carreau = 48;
      var colonnes = Math.max(1, Math.floor(zone.clientWidth / carreau));
      var rangees = Math.max(1, Math.floor(zone.clientHeight / carreau));
      zone.style.setProperty('--taille-carreau-x', (zone.clientWidth / colonnes) + 'px');
      zone.style.setProperty('--taille-carreau-y', (zone.clientHeight / rangees) + 'px');
    });
  }
  ajusterQuadrillage();
  window.addEventListener('resize', ajusterQuadrillage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajusterQuadrillage);

  document.querySelectorAll('[data-galerie]').forEach(function (bouton) {
    bouton.addEventListener('click', function () {
      document.querySelectorAll('[data-galerie]').forEach(function (b) { b.classList.remove('actif'); b.setAttribute('aria-selected', 'false'); });
      document.querySelectorAll('.jour-galerie').forEach(function (g) { g.classList.remove('actif'); });
      bouton.classList.add('actif'); bouton.setAttribute('aria-selected', 'true');
      var galerie = document.getElementById(bouton.dataset.galerie);
      if (galerie) {
        galerie.classList.add('actif');
        requestAnimationFrame(function () { mettreEnPage(galerie); });
      }
      if (!bouton.closest('#sous-menu-actes')) {
        boutonMouvement.classList.remove('actif');
        boutonMouvement.setAttribute('aria-expanded', 'false');
        sousMenuActes.hidden = true;
      }
    });
  });
  var boutonMouvement = document.getElementById('mouvement-toggle');
  var sousMenuActes = document.getElementById('sous-menu-actes');
  boutonMouvement.addEventListener('click', function () {
    var ouvert = boutonMouvement.getAttribute('aria-expanded') === 'true';
    boutonMouvement.setAttribute('aria-expanded', String(!ouvert));
    boutonMouvement.classList.toggle('actif', !ouvert);
    sousMenuActes.hidden = ouvert;
  });
  function mettreEnPage(galerie) {
    if (!galerie || !galerie.classList.contains('actif')) return;
    var largeur = galerie.clientWidth;
    if (!largeur) return;
    var figures = Array.from(galerie.querySelectorAll(':scope > figure'));
    var cible = Math.max(180, Math.min(300, largeur * .22));
    var gap = parseFloat(getComputedStyle(galerie).columnGap) || 0;
    var totalRatio = 0;
    figures.forEach(function (figure) {
      var image = figure.querySelector('img');
      var imageW = image ? Number(image.getAttribute('width')) : 0;
      var imageH = image ? Number(image.getAttribute('height')) : 0;
      var ratio = imageW && imageH ? imageW / imageH : 1;
      figure.dataset.ratio = ratio;
      figure.style.flex = '0 0 auto';
      figure.style.width = '';
      figure.style.height = '';
      totalRatio += ratio;
    });
    if (!figures.length) return;
    var nbRangees = Math.max(1, Math.round(totalRatio / (largeur / cible)));
    var rangees = [], index = 0, ratioRestant = totalRatio;
    for (var r = 0; r < nbRangees; r++) {
      var nbRestantes = nbRangees - r;
      var cibleRatio = ratioRestant / nbRestantes;
      var groupe = [], ratioGroupe = 0;
      while (index < figures.length && (groupe.length === 0 || ratioGroupe < cibleRatio)) {
        var figure = figures[index++];
        groupe.push(figure);
        ratioGroupe += Number(figure.dataset.ratio);
      }
      ratioRestant -= ratioGroupe;
      rangees.push({ figures: groupe, ratio: ratioGroupe });
    }
    rangees.forEach(function (rangee) {
      var hauteur = (largeur - gap * (rangee.figures.length - 1)) / rangee.ratio;
      var largeurUtilisee = 0;
      rangee.figures.forEach(function (figure, i) {
        var w = i === rangee.figures.length - 1
          ? largeur - gap * (rangee.figures.length - 1) - largeurUtilisee
          : Number(figure.dataset.ratio) * hauteur;
        figure.style.width = w + 'px';
        figure.style.height = hauteur + 'px';
        largeurUtilisee += w;
      });
    });
  }
  mettreEnPage(document.querySelector('.jour-galerie.actif'));
  window.addEventListener('resize', function () {
    mettreEnPage(document.querySelector('.jour-galerie.actif'));
  });
  var dialogue = document.getElementById('visionneuse'), grande = dialogue.querySelector('img'), infos = dialogue.querySelector('.infos');
  var dernierePhoto = 0;
  function ouvrir(img) {
    var id = ++dernierePhoto;
    var apercu = img.currentSrc || img.src;
    var original = img.dataset.grand || apercu;
    grande.removeAttribute('src'); grande.alt = img.alt; infos.textContent = '';
    grande.src = apercu; dialogue.showModal();
    if (original !== apercu) {
      var chargee = new Image(); chargee.src = original;
      if (chargee.decode) chargee.decode().then(function () {
        if (id === dernierePhoto && dialogue.open) grande.src = original;
      }).catch(function () {});
      else chargee.onload = function () { if (id === dernierePhoto && dialogue.open) grande.src = original; };
    }
    if (window.exifr) window.exifr.parse(original).then(function (m) {
      if (id === dernierePhoto && m && m.DateTimeOriginal)
        infos.textContent = 'Date : ' + m.DateTimeOriginal.toLocaleDateString('fr-FR');
    }).catch(function () {});
  }
  document.addEventListener('click', function (e) { var img = e.target.closest('.jour-galerie img'); if (img) ouvrir(img); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.matches('.jour-galerie img')) ouvrir(e.target); });
  dialogue.querySelector('.fermer').addEventListener('click', function () { dialogue.close(); });
  dialogue.addEventListener('click', function (e) { if (e.target === dialogue) dialogue.close(); });
</script>
