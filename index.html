<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
  function ajusterQuadrillage() {
    document.querySelectorAll('.accueil').forEach(function (zone) {
      var carreau = 48;
      var colonnes = Math.max(1, Math.floor(zone.clientWidth / carreau));
      var rangees = Math.max(1, Math.floor(zone.clientHeight / carreau));
      zone.style.setProperty('--taille-carreau-x', (zone.clientWidth / colonnes) + 'px');
      zone.style.setProperty('--taille-carreau-y', (zone.clientHeight / rangees) + 'px');
    });
  }
  ajusterQuadrillage();
  window.addEventListener('resize', ajusterQuadrillage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajusterQuadrillage);

  // Charge aussi les photos qui apparaîtront en reculant dans les rangées.
  document.querySelectorAll("#manifestation .piste img").forEach(function (img) {
    img.loading = "eager";
    img.decoding = "async";
  });

  // Trois copies gardent la rangée loin des limites du défilement, dans les deux sens.
  var PIXELS_PAR_SECONDE = 40;   // vitesse du défilement : plus grand = plus rapide
  var mouvementReduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ignorerProchainClic = false;

  function copier(piste, jeu) {
    jeu.forEach(function (fig) {
      var copie = fig.cloneNode(true);
      copie.classList.add("copie");
      copie.setAttribute("aria-hidden", "true");
      copie.querySelectorAll("img").forEach(function (img) { img.loading = "eager"; });
      piste.appendChild(copie);
    });
  }

  // Mélange toutes les photos de la page d'accueil ensemble, puis les répartit entre les rangées.
  var pistesAccueil = Array.from(document.querySelectorAll("#manifestation .piste"));
  var photosAccueil = pistesAccueil.reduce(function (photos, piste) {
    return photos.concat(Array.from(piste.children));
  }, []);
  for (var k = photosAccueil.length - 1; k > 0; k--) {
    var aleatoire = Math.floor(Math.random() * (k + 1));
    var photoTemp = photosAccueil[k]; photosAccueil[k] = photosAccueil[aleatoire]; photosAccueil[aleatoire] = photoTemp;
  }
  pistesAccueil.forEach(function (piste) { piste.replaceChildren(); });
  photosAccueil.forEach(function (figure, index) {
    if (pistesAccueil.length) pistesAccueil[index % pistesAccueil.length].appendChild(figure);
  });

  document.querySelectorAll(".piste").forEach(function (piste) {
    var jeu = Array.from(piste.children);
    var largeur = piste.scrollWidth;
    if (!largeur) return;
    if (!mouvementReduit) {
      for (var n = 1; n * largeur < window.innerWidth; n++) copier(piste, jeu);
      var premiereCopie = Array.from(piste.children);
      copier(piste, premiereCopie);
      copier(piste, premiereCopie);
    }
    var ligne = piste.closest(".ligne");
    var glisser = false, aBouge = false, captureGlisse = false, departX = 0, dernierX = 0, derniereInteraction = 0;
    var largeurBoucle = function () { return piste.scrollWidth / (mouvementReduit ? 1 : 3); };
    var lignesManif = Array.from(document.querySelectorAll("#manifestation .ligne"));
    var sens = lignesManif.indexOf(ligne) % 2 === 0 ? 1 : -1;
    if (!mouvementReduit) {
      ligne.scrollLeft = largeurBoucle();
      ligne.addEventListener("scroll", function () {
        var boucle = largeurBoucle();
        if (boucle <= 0) return;
        var position = ligne.scrollLeft;
        var recentree = ((position - boucle) % boucle + boucle) % boucle + boucle;
        if (Math.abs(recentree - position) > 0.5) ligne.scrollLeft = recentree;
      }, { passive: true });
    }
    ligne.addEventListener("pointerdown", function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      derniereInteraction = performance.now();
      glisser = true; aBouge = false; captureGlisse = false; departX = e.clientX; dernierX = e.clientX;
      if (e.pointerType !== "mouse") return;
      ligne.classList.add("glisse");
    });
    ligne.addEventListener("pointermove", function (e) {
      if (!glisser) return;
      if (Math.abs(e.clientX - departX) > 5) {
        aBouge = true;
        ignorerProchainClic = true;
        if (e.pointerType === "mouse" && !captureGlisse && ligne.setPointerCapture) {
          ligne.setPointerCapture(e.pointerId);
          captureGlisse = true;
        }
      }
      if (e.pointerType !== "mouse") return;
      ligne.scrollLeft -= e.clientX - dernierX;
      dernierX = e.clientX;
      derniereInteraction = performance.now();
    });
    function finGlisser() {
      glisser = false; ligne.classList.remove("glisse");
      derniereInteraction = performance.now();
      if (aBouge) window.setTimeout(function () { ignorerProchainClic = false; }, 250);
    }
    ligne.addEventListener("pointerup", finGlisser);
    ligne.addEventListener("pointercancel", finGlisser);
    if (!mouvementReduit) {
      var precedent = performance.now();
      function defiler(maintenant) {
        var deltaTemps = Math.min(maintenant - precedent, 50);
        precedent = maintenant;
        if (!glisser && maintenant - derniereInteraction > 900) {
          ligne.scrollLeft += sens * PIXELS_PAR_SECONDE * deltaTemps / 1000;
        }
        requestAnimationFrame(defiler);
      }
      requestAnimationFrame(defiler);
    }
  });

  // Menu déroulant : s’ouvre au survol (souris) ou au clavier (Tab) grâce au CSS.
  // Sur écran tactile (pas de survol), il s’ouvre au toucher et se ferme en touchant ailleurs ou sur un lien.
  var deroulant = document.querySelector(".deroulant");
  if (deroulant) {
    var tactile = !window.matchMedia("(hover: hover)").matches;
    var fermer = function () { deroulant.classList.remove("ouvert"); };
    deroulant.querySelector("button").addEventListener("click", function () {
      if (tactile) deroulant.classList.toggle("ouvert");
    });
    document.addEventListener("click", function (e) {
      if (!deroulant.contains(e.target) || e.target.closest(".sous-menu a")) fermer();
    });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") fermer(); });
  }

  // Photo en grand + métadonnées (EXIF) si elles existent dans le fichier.
  var dialogue = document.getElementById("visionneuse");
  var grande = dialogue.querySelector("img");
  var infos = dialogue.querySelector(".infos");
  var dernier = 0;

  // Rend les photos accessibles au clavier (Tab puis Entrée)
  document.querySelectorAll(".piste figure:not(.copie) img").forEach(function (img) {
    img.tabIndex = 0;
    img.setAttribute("role", "button");
  });

  function ajouter(nom, valeur) {
    if (valeur === undefined || valeur === null || valeur === "") return;
    var dt = document.createElement("dt");
    var dd = document.createElement("dd");
    dt.textContent = nom;
    dd.textContent = valeur;
    infos.appendChild(dt);
    infos.appendChild(dd);
  }

  function afficherInfos(m) {
    infos.textContent = "";
    if (!m) return;
    var appareil = [m.Make, m.Model].filter(Boolean).join(" ");
    var vitesse = m.ExposureTime
      ? (m.ExposureTime < 1 ? "1/" + Math.round(1 / m.ExposureTime) : m.ExposureTime) + " s"
      : "";
    ajouter("Appareil", appareil);
    ajouter("Objectif", m.LensModel);
    ajouter("Focale", m.FocalLength ? Math.round(m.FocalLength) + " mm" : "");
    ajouter("Ouverture", m.FNumber ? "f/" + m.FNumber : "");
    ajouter("Vitesse", vitesse);
    ajouter("ISO", m.ISO);
    ajouter("Date", m.DateTimeOriginal instanceof Date
      ? m.DateTimeOriginal.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })
      : "");
  }

  function ouvrir(img) {
    var moi = ++dernier;
    var apercu = img.currentSrc || img.src;
    var original = img.dataset.grand || apercu;
    grande.removeAttribute("src");
    grande.alt = img.alt;
    infos.textContent = "";
    grande.src = apercu;
    dialogue.showModal();
    if (original !== apercu) {
      var chargee = new Image();
      chargee.src = original;
      if (chargee.decode) chargee.decode().then(function () {
        if (moi === dernier && dialogue.open) grande.src = original;
      }).catch(function () {});
      else chargee.onload = function () { if (moi === dernier && dialogue.open) grande.src = original; };
    }
    if (!window.exifr) return;
    window.exifr.parse(original, {
      pick: ["Make", "Model", "LensModel", "FocalLength", "FNumber", "ExposureTime", "ISO", "DateTimeOriginal"]
    }).then(function (m) {
      if (moi === dernier) afficherInfos(m);   // ignore si une autre photo a été ouverte entre-temps
    }).catch(function () {});                   // pas de métadonnées lisibles : on n'affiche rien
  }

  document.addEventListener("click", function (e) {
    if (ignorerProchainClic) { ignorerProchainClic = false; e.preventDefault(); return; }
    var img = e.target.closest(".piste img");
    if (img) ouvrir(img);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.matches && e.target.matches(".piste img")) ouvrir(e.target);
  });
  dialogue.querySelector(".fermer").addEventListener("click", function () { dialogue.close(); });
  dialogue.addEventListener("click", function (e) { if (e.target === dialogue) dialogue.close(); });
</script>

</body>
</html>
